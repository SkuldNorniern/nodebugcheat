name: Nightly

on:
  schedule:
    - cron: '0 0 * * *'   # 00:00 UTC daily
  workflow_dispatch:        # allow manual trigger

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  nightly:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Extract metadata
        id: meta
        run: |
          DATE=$(date -u +%Y%m%d)
          echo "DATE=$DATE" >> "$GITHUB_OUTPUT"
          echo "NIGHTLY_VERSION=nightly-$DATE" >> "$GITHUB_OUTPUT"
          echo "MC_VERSION=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "NEO_VERSION=$(grep '^neo_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Build
        run: ./gradlew build -Pmod_version=${{ steps.meta.outputs.NIGHTLY_VERSION }}

      - name: Delete previous nightly release
        run: gh release delete nightly --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish nightly release
        run: |
          gh release create nightly \
            --title "Nightly ${{ steps.meta.outputs.DATE }}" \
            --notes "**Automated nightly build** — may be unstable.

          Built from: \`${{ github.sha }}\`
          Date: \`${{ steps.meta.outputs.DATE }}\`
          Minecraft: \`${{ steps.meta.outputs.MC_VERSION }}\`
          NeoForge: \`${{ steps.meta.outputs.NEO_VERSION }}\`

          This release is replaced every day. Use a tagged release for production." \
            --prerelease \
            --target "${{ github.sha }}" \
            "build/libs/nodebugcheat-${{ steps.meta.outputs.NIGHTLY_VERSION }}.jar"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
