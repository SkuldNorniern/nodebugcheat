name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Extract metadata
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "MC_VERSION=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "NEO_VERSION=$(grep '^neo_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Build
        run: ./gradlew build -Pmod_version=${{ steps.meta.outputs.VERSION }}

      - name: Generate changelog
        id: changelog
        run: |
          PREV=$(git tag --sort=-version:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sed -n '2p')
          if [ -z "$PREV" ]; then
            LOG=$(git log --pretty=format:"- %s (%h)" HEAD)
          else
            LOG=$(git log --pretty=format:"- %s (%h)" "${PREV}..HEAD")
          fi
          # Write notes to file so multiline content is handled safely
          cat > /tmp/release_notes.md << NOTES
          ## NoDebugCheat ${{ github.ref_name }}

          **Minecraft:** ${{ steps.meta.outputs.MC_VERSION }}
          **NeoForge:** ${{ steps.meta.outputs.NEO_VERSION }}

          ### Changes
          $LOG

          ---
          Download the JAR and place it in your `mods/` folder.
          NOTES

      - name: Create GitHub Release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "NoDebugCheat $GITHUB_REF_NAME" \
            --notes-file /tmp/release_notes.md \
            "build/libs/nodebugcheat-${{ steps.meta.outputs.VERSION }}.jar"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
